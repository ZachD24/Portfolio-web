<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projet — Zachary Drolet Architecte</title>
  <meta name="description" content="Détail d'un projet de Zachary Drolet, étudiant en architecture.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Inter:wght@300;400;500&display=swap">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">

  <style>
    /* ── Carousel ─────────────────────────────────────────── */
    .carousel {
      position: relative;
      width: 100%;
      background: #0f0f0f;
      user-select: none;
    }

    .carousel__viewport {
      overflow: hidden;
      width: 100%;
    }

    .carousel__track {
      display: flex;
      transition: transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      will-change: transform;
    }

    .carousel__slide {
      flex: 0 0 100%;
      width: 100%;
      min-height: 320px;
      max-height: 75vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .carousel__img {
      max-width: 100%;
      max-height: 75vh;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
      /* Dragging ne déclenche pas de navigation sur l'image */
      pointer-events: none;
    }

    /* Boutons prev / next */
    .carousel__btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 44px;
      height: 44px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      cursor: pointer;
      transition: background 0.2s ease, opacity 0.2s ease;
      z-index: 10;
    }

    .carousel__btn:hover { background: rgba(255,255,255,0.25); }
    .carousel__btn:disabled { opacity: 0.2; cursor: default; }

    .carousel__btn--prev { left: 1rem; }
    .carousel__btn--next { right: 1rem; }

    /* Caption + indicateurs */
    .carousel__footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.875rem 0 0;
      flex-wrap: wrap;
    }

    .carousel__caption {
      font-size: 0.875rem;
      color: var(--color-muted);
      font-style: italic;
      line-height: 1.5;
      flex: 1;
      min-width: 0;
      transition: opacity 0.3s ease;
    }

    .carousel__dots {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .carousel__dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--color-border);
      border: none;
      cursor: pointer;
      padding: 0;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .carousel__dot.active {
      background: var(--color-accent);
      transform: scale(1.3);
    }

    /* ── Layout page projet ───────────────────────────────── */
    .project-detail-body {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: clamp(2rem, 5vw, 4rem);
      align-items: start;
      margin-top: 3rem;
    }

    .project-detail-meta {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .project-detail-meta-item {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    .project-detail-meta-label {
      font-size: 0.6875rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--color-accent);
    }

    .project-detail-meta-value {
      font-size: 0.9375rem;
      color: var(--color-text);
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.8125rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--color-muted);
      transition: color 0.15s ease;
      margin-bottom: 2rem;
    }

    .back-link:hover { color: var(--color-accent); }

    .back-link svg {
      transition: transform 0.15s ease;
    }
    .back-link:hover svg { transform: translateX(-3px); }

    .project-not-found {
      text-align: center;
      padding-block: 6rem;
      color: var(--color-muted);
    }

    @media (max-width: 700px) {
      .project-detail-body { grid-template-columns: 1fr; }
      .project-detail-meta { flex-direction: row; flex-wrap: wrap; gap: 1rem 2rem; }
      .carousel__btn { width: 36px; height: 36px; }
    }
  </style>
</head>
<body>

  <!-- ── Navigation ── -->
  <nav class="nav" role="navigation" aria-label="Navigation principale">
    <div class="container nav__inner">
      <a href="index.html" class="nav__logo">Zachary Drolet</a>

      <button class="nav-toggle" aria-label="Ouvrir le menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>

      <ul class="nav-menu" role="list">
        <li><a href="index.html"    class="nav-link" data-i18n="nav.home">Accueil</a></li>
        <li><a href="projets.html"  class="nav-link" data-i18n="nav.projects">Projets</a></li>
        <li><a href="a-propos.html" class="nav-link" data-i18n="nav.about">À propos</a></li>
        <li><a href="contact.html"  class="nav-link" data-i18n="nav.contact">Contact</a></li>
        <li><a href="cv.html"       class="nav-link" data-i18n="nav.cv">CV</a></li>
        <li>
          <button id="lang-toggle" class="btn-lang" data-i18n="lang.toggle" aria-label="Changer la langue">EN</button>
        </li>
      </ul>
    </div>
  </nav>

  <main style="padding-top: var(--nav-height);">

    <!-- Carousel pleine largeur -->
    <div id="carousel-wrapper">
      <!-- Injecté par JS -->
    </div>

    <section class="section">
      <div class="container">

        <a href="projets.html" class="back-link">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M10 3L5 8L10 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span data-i18n="nav.projects">Projets</span>
        </a>

        <div id="project-content">
          <div class="project-not-found"><p>Chargement…</p></div>
        </div>

      </div>
    </section>

  </main>

  <!-- ── Footer ── -->
  <footer class="footer">
    <div class="container footer__inner">
      <p>Zachary Drolet — <a href="mailto:zachary.drolet@exemple.com" class="link-underline">zachary.drolet@exemple.com</a></p>
      <p data-i18n="footer.rights">Tous droits réservés</p>
    </div>
  </footer>

  <script src="data/translations.js"></script>
  <script src="data/projects.js"></script>
  <script src="js/lang.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const params  = new URLSearchParams(location.search);
      const id      = params.get('id');
      const lang    = typeof Lang !== 'undefined' ? Lang.getCurrent() : 'fr';
      const project = typeof PROJECTS !== 'undefined' ? PROJECTS.find(p => p.id === id) : null;

      const carouselWrapper = document.getElementById('carousel-wrapper');
      const content         = document.getElementById('project-content');

      if (!project) {
        content.innerHTML = `<div class="project-not-found"><p>${lang === 'fr' ? 'Projet introuvable.' : 'Project not found.'}</p></div>`;
        return;
      }

      const title  = lang === 'fr' ? project.titleFR : project.titleEN;
      const type   = lang === 'fr' ? project.typeFR  : project.typeEN;
      const desc   = lang === 'fr' ? project.descriptionFR : project.descriptionEN;
      const slides = project.slides && project.slides.length
        ? project.slides
        : [{ image: project.image, captionFR: '', captionEN: '' }];

      document.title = `${title} — Zachary Drolet Architecte`;

      // ── Carousel ────────────────────────────────────────
      const multiSlide = slides.length > 1;

      carouselWrapper.innerHTML = `
        <div class="carousel" id="carousel" role="region" aria-label="${title}" aria-roledescription="carousel">
          <div class="carousel__viewport">
            <div class="carousel__track" id="c-track">
              ${slides.map((s, i) => `
                <div class="carousel__slide" role="group" aria-label="Image ${i + 1} sur ${slides.length}" aria-roledescription="slide">
                  <img
                    src="${s.image}"
                    alt="${lang === 'fr' ? (s.captionFR || title) : (s.captionEN || title)}"
                    class="carousel__img"
                    loading="${i === 0 ? 'eager' : 'lazy'}"
                  >
                </div>`).join('')}
            </div>
          </div>
          ${multiSlide ? `
            <button class="carousel__btn carousel__btn--prev" id="c-prev" aria-label="${lang === 'fr' ? 'Image précédente' : 'Previous image'}">
              <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
                <path d="M11 4L6 9L11 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <button class="carousel__btn carousel__btn--next" id="c-next" aria-label="${lang === 'fr' ? 'Image suivante' : 'Next image'}">
              <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
                <path d="M7 4L12 9L7 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>` : ''}
        </div>
        <div class="container">
          <div class="carousel__footer">
            <p class="carousel__caption" id="c-caption" aria-live="polite"></p>
            ${multiSlide ? `<div class="carousel__dots" id="c-dots" role="tablist" aria-label="Slides"></div>` : ''}
          </div>
        </div>`;

      // ── Logique du carousel ──────────────────────────────
      const track   = document.getElementById('c-track');
      const caption = document.getElementById('c-caption');
      const dotsEl  = document.getElementById('c-dots');
      const btnPrev = document.getElementById('c-prev');
      const btnNext = document.getElementById('c-next');

      let current = 0;

      // Crée les points indicateurs
      let dots = [];
      if (dotsEl) {
        slides.forEach((_, i) => {
          const dot = document.createElement('button');
          dot.className = 'carousel__dot' + (i === 0 ? ' active' : '');
          dot.setAttribute('role', 'tab');
          dot.setAttribute('aria-label', `Image ${i + 1}`);
          dot.addEventListener('click', () => goTo(i));
          dotsEl.appendChild(dot);
          dots.push(dot);
        });
      }

      function goTo(index) {
        current = Math.max(0, Math.min(index, slides.length - 1));
        track.style.transform = `translateX(-${current * 100}%)`;

        // Caption avec léger fondu
        if (caption) {
          caption.style.opacity = '0';
          setTimeout(() => {
            const s = slides[current];
            caption.textContent = lang === 'fr' ? s.captionFR : s.captionEN;
            caption.style.opacity = '1';
          }, 180);
        }

        // Mise à jour des dots
        dots.forEach((d, i) => d.classList.toggle('active', i === current));

        // État des boutons
        if (btnPrev) btnPrev.disabled = current === 0;
        if (btnNext) btnNext.disabled = current === slides.length - 1;
      }

      if (btnPrev) btnPrev.addEventListener('click', () => goTo(current - 1));
      if (btnNext) btnNext.addEventListener('click', () => goTo(current + 1));

      // Clavier
      document.getElementById('carousel').addEventListener('keydown', e => {
        if (e.key === 'ArrowLeft')  { e.preventDefault(); goTo(current - 1); }
        if (e.key === 'ArrowRight') { e.preventDefault(); goTo(current + 1); }
      });

      // Swipe tactile (pointer events)
      let startX = 0;
      const vp = carouselWrapper.querySelector('.carousel__viewport');

      vp.addEventListener('pointerdown', e => {
        startX = e.clientX;
        vp.setPointerCapture(e.pointerId);
      }, { passive: true });

      vp.addEventListener('pointerup', e => {
        const dx = e.clientX - startX;
        if (Math.abs(dx) > 40) goTo(current + (dx < 0 ? 1 : -1));
      }, { passive: true });

      // Init
      goTo(0);

      // ── Corps de la page ─────────────────────────────────
      content.innerHTML = `
        <div class="project-detail-body">
          <div class="fade-in" data-delay="1">
            <h1 style="font-family:var(--font-serif);font-size:clamp(2rem,5vw,3.5rem);font-weight:300;margin-bottom:1.5rem;">${title}</h1>
            <div class="divider"></div>
            <p style="font-size:1.0625rem;line-height:1.85;color:var(--color-muted);">${desc}</p>
          </div>

          <aside class="project-detail-meta fade-in" data-delay="2">
            <div class="project-detail-meta-item">
              <span class="project-detail-meta-label">${lang === 'fr' ? 'Type' : 'Type'}</span>
              <span class="project-detail-meta-value">${type}</span>
            </div>
            <div class="project-detail-meta-item">
              <span class="project-detail-meta-label">${lang === 'fr' ? 'Année' : 'Year'}</span>
              <span class="project-detail-meta-value">${project.year}</span>
            </div>
            <div class="project-detail-meta-item">
              <span class="project-detail-meta-label">${lang === 'fr' ? 'Lieu' : 'Location'}</span>
              <span class="project-detail-meta-value">${project.location}</span>
            </div>
          </aside>
        </div>`;

      document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));
    });
  </script>

</body>
</html>
