<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projet — Zachary Drolet Architecte</title>
  <meta name="description" content="Détail d'un projet de Zachary Drolet, étudiant en architecture.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Inter:wght@300;400;500&display=swap">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">

  <style>
    /* ── Hero image pleine largeur ────────────────────────── */
    .project-hero {
      width: 100%;
      max-height: 75vh;
      overflow: hidden;
      background: #0f0f0f;
    }

    .project-hero__img {
      width: 100%;
      height: 75vh;
      object-fit: cover;
      display: block;
    }

    /* ── Sections avec images inline ──────────────────────── */
    .sections-wrapper {
      margin-top: 1.5rem;
    }

    .section-block {
      margin-top: 1.75rem;
      padding-top: 1.75rem;
      border-top: 1px solid var(--color-border);
    }

    .sections-wrapper .section-block:first-child {
      margin-top: 0;
      padding-top: 0;
      border-top: none;
    }

    .section-block__heading {
      font-family: var(--font-serif);
      font-size: 1.0625rem;
      font-weight: 400;
      color: var(--color-accent);
      letter-spacing: 0.04em;
      margin-bottom: 0.6rem;
    }

    .section-block__text {
      font-size: 1rem;
      line-height: 1.85;
      color: var(--color-muted);
    }

    .section-block__img-wrapper {
      margin-top: 1.25rem;
    }

    .section-block__img {
      width: 100%;
      height: auto;
      display: block;
    }

    .section-block__caption {
      font-size: 0.8125rem;
      font-style: italic;
      color: var(--color-muted);
      margin-top: 0.5rem;
    }

    /* ── Layout page projet ───────────────────────────────── */
    .project-detail-body {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: clamp(2rem, 5vw, 4rem);
      align-items: start;
      margin-top: 3rem;
    }

    .project-detail-meta {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .project-detail-meta-item {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    .project-detail-meta-label {
      font-size: 0.6875rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--color-accent);
    }

    .project-detail-meta-value {
      font-size: 0.9375rem;
      color: var(--color-text);
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.8125rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--color-muted);
      transition: color 0.15s ease;
      margin-bottom: 2rem;
    }

    .back-link:hover { color: var(--color-accent); }

    .back-link svg { transition: transform 0.15s ease; }
    .back-link:hover svg { transform: translateX(-3px); }

    .project-not-found {
      text-align: center;
      padding-block: 6rem;
      color: var(--color-muted);
    }

    @media (max-width: 700px) {
      .project-detail-body { grid-template-columns: 1fr; }
      .project-detail-meta { flex-direction: row; flex-wrap: wrap; gap: 1rem 2rem; }
      .carousel__btn { width: 36px; height: 36px; }
      .project-hero__img { height: 50vw; }
    }
  </style>
</head>
<body>

  <!-- ── Navigation ── -->
  <nav class="nav" role="navigation" aria-label="Navigation principale">
    <div class="container nav__inner">
      <a href="index.html" class="nav__logo">Zachary Drolet</a>

      <button class="nav-toggle" aria-label="Ouvrir le menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>

      <ul class="nav-menu" role="list">
        <li><a href="index.html"    class="nav-link" data-i18n="nav.home">Accueil</a></li>
        <li><a href="projets.html"  class="nav-link" data-i18n="nav.projects">Projets</a></li>
        <li><a href="a-propos.html" class="nav-link" data-i18n="nav.about">À propos</a></li>
        <li><a href="contact.html"  class="nav-link" data-i18n="nav.contact">Contact</a></li>
        <li><a href="cv.html"       class="nav-link" data-i18n="nav.cv">CV</a></li>
        <li>
          <button id="lang-toggle" class="btn-lang" data-i18n="lang.toggle" aria-label="Changer la langue">EN</button>
        </li>
      </ul>
    </div>
  </nav>

  <main style="padding-top: var(--nav-height);">

    <!-- Image hero ou carousel — injecté par JS -->
    <div id="carousel-wrapper"></div>

    <section class="section">
      <div class="container">

        <a href="projets.html" class="back-link">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M10 3L5 8L10 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span data-i18n="nav.projects">Projets</span>
        </a>

        <div id="project-content">
          <div class="project-not-found"><p>Chargement…</p></div>
        </div>

      </div>
    </section>

  </main>

  <!-- ── Footer ── -->
  <footer class="footer">
    <div class="container footer__inner">
      <p>Zachary Drolet — <a href="mailto:zadro@ulaval.ca" class="link-underline">zadro@ulaval.ca</a></p>
      <p data-i18n="footer.rights">Tous droits réservés</p>
    </div>
  </footer>

  <script src="data/translations.js"></script>
  <script src="data/projects.js"></script>
  <script src="js/lang.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const params  = new URLSearchParams(location.search);
      const id      = params.get('id');
      const lang    = typeof Lang !== 'undefined' ? Lang.getCurrent() : 'fr';
      const project = typeof PROJECTS !== 'undefined' ? PROJECTS.find(p => p.id === id) : null;

      const carouselWrapper = document.getElementById('carousel-wrapper');
      const content         = document.getElementById('project-content');

      if (!project) {
        content.innerHTML = `<div class="project-not-found"><p>${lang === 'fr' ? 'Projet introuvable.' : 'Project not found.'}</p></div>`;
        return;
      }

      const title  = lang === 'fr' ? project.titleFR : project.titleEN;
      const type   = lang === 'fr' ? project.typeFR  : project.typeEN;
      const desc   = lang === 'fr' ? project.descriptionFR : project.descriptionEN;
      const slides = project.slides && project.slides.length
        ? project.slides
        : [{ image: project.image, captionFR: '', captionEN: '' }];

      document.title = `${title} — Zachary Drolet Architecte`;

      // ── Image hero pleine largeur ──────────────────────────
      carouselWrapper.innerHTML = `
        <div class="project-hero">
          <img src="${slides[0].image}" alt="${title}" class="project-hero__img" loading="eager">
        </div>`;

      // ── Corps de la page ───────────────────────────────────
      function renderBody() {
        if (project.sections && project.sections.length) {
          const sectionsHTML = project.sections.map(s => {
            const heading = lang === 'fr' ? s.headingFR : s.headingEN;
            const text    = lang === 'fr' ? s.textFR    : s.textEN;
            const caption = s.image
              ? (lang === 'fr' ? (s.captionFR || '') : (s.captionEN || ''))
              : '';
            return `
              <div class="section-block">
                <h3 class="section-block__heading">${heading}</h3>
                <p class="section-block__text">${text}</p>
                ${s.image ? `
                  <div class="section-block__img-wrapper">
                    <img src="${s.image}" alt="${heading}" class="section-block__img" loading="lazy">
                    ${caption ? `<p class="section-block__caption">${caption}</p>` : ''}
                  </div>` : ''}
              </div>`;
          }).join('');
          return `<div class="sections-wrapper">${sectionsHTML}</div>`;
        }
        return (desc || '').split('\n\n').map(p =>
          `<p style="font-size:1.0625rem;line-height:1.85;color:var(--color-muted);margin-bottom:1rem;">${p}</p>`
        ).join('');
      }

      content.innerHTML = `
        <div class="project-detail-body">
          <div class="fade-in" data-delay="1">
            <h1 style="font-family:var(--font-serif);font-size:clamp(2rem,5vw,3.5rem);font-weight:300;margin-bottom:1.5rem;">${title}</h1>
            <div class="divider"></div>
            ${renderBody()}
          </div>

          <aside class="project-detail-meta fade-in" data-delay="2">
            <div class="project-detail-meta-item">
              <span class="project-detail-meta-label">${lang === 'fr' ? 'Type' : 'Type'}</span>
              <span class="project-detail-meta-value">${type}</span>
            </div>
            <div class="project-detail-meta-item">
              <span class="project-detail-meta-label">${lang === 'fr' ? 'Année' : 'Year'}</span>
              <span class="project-detail-meta-value">${project.year}</span>
            </div>
            <div class="project-detail-meta-item">
              <span class="project-detail-meta-label">${lang === 'fr' ? 'Lieu' : 'Location'}</span>
              <span class="project-detail-meta-value">${project.location}</span>
            </div>
          </aside>
        </div>`;

      document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));
    });
  </script>

</body>
</html>
