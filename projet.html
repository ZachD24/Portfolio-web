<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projet — Zachary Drolet Architecte</title>
  <meta name="description" content="Détail d'un projet de Zachary Drolet, étudiant en architecture.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Inter:wght@300;400;500&display=swap">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">

  <style>
    /* ── Hero image pleine largeur ────────────────────────── */
    .project-hero {
      width: 100%;
      max-height: 75vh;
      overflow: hidden;
      background: #0f0f0f;
    }

    .project-hero__img {
      width: 100%;
      height: 75vh;
      object-fit: cover;
      display: block;
    }

    /* Hero sans recadrage (heroCover: false) */
    .project-hero--contain {
      max-height: none;
      background: var(--color-card-bg);
    }
    .project-hero--contain .project-hero__img {
      height: auto;
      object-fit: initial;
    }

    /* ── Barre méta inline (type · année · lieu) ──────────── */
    .project-meta-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 0.2rem 1.5rem;
      margin: 0.75rem 0 1.5rem;
    }

    .project-meta-bar__item {
      display: flex;
      align-items: baseline;
      gap: 0.45rem;
    }

    .project-meta-bar__label {
      font-size: 0.625rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--color-accent);
    }

    .project-meta-bar__value {
      font-size: 0.9rem;
      color: var(--color-text);
    }

    .project-meta-bar__sep {
      color: var(--color-border);
      font-size: 0.75rem;
    }

    /* ── Layout page projet — pleine largeur ──────────────── */
    .project-detail-body {
      margin-top: 3rem;
    }

    /* ── Sections avec images inline ──────────────────────── */
    .sections-wrapper {
      margin-top: 1.5rem;
    }

    .section-block {
      margin-top: 1.75rem;
      padding-top: 1.75rem;
      border-top: 1px solid var(--color-border);
    }

    .sections-wrapper .section-block:first-child {
      margin-top: 0;
      padding-top: 0;
      border-top: none;
    }

    .section-block__heading {
      font-family: var(--font-serif);
      font-size: 1.0625rem;
      font-weight: 400;
      color: var(--color-accent);
      letter-spacing: 0.04em;
      margin-bottom: 0.6rem;
    }

    .section-block__text {
      font-size: 1rem;
      line-height: 1.85;
      color: var(--color-muted);
      max-width: 72ch;
    }

    .section-block__img-wrapper {
      margin-top: 1.25rem;
    }

    .section-block__img {
      width: 100%;
      height: auto;
      display: block;
      cursor: zoom-in;
    }

    .section-block__caption {
      font-size: 0.8125rem;
      font-style: italic;
      color: var(--color-muted);
      margin-top: 0.5rem;
    }

    /* ── Grille images section (prototypage) ──────────────── */
    .section-images-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.25rem;
      margin-top: 1.25rem;
    }
    .section-images-grid__item {
      margin: 0;
    }
    .section-images-grid__item img {
      width: 100%;
      aspect-ratio: 4/3;
      object-fit: contain;
      background: var(--color-card-bg);
      display: block;
      cursor: zoom-in;
    }
    .section-images-grid__item figcaption {
      font-size: 0.8125rem;
      font-style: italic;
      color: var(--color-muted);
      margin-top: 0.4rem;
    }

    /* ── Images numérotées (instructions) ─────────────────── */
    .section-images-numbered {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.25rem;
      margin-top: 1.25rem;
    }
    .section-images-numbered__item {
      position: relative;
      margin: 0;
    }
    .section-images-numbered__num {
      position: absolute;
      top: 0.6rem;
      left: 0.6rem;
      font-family: var(--font-serif);
      font-size: 0.9rem;
      color: var(--color-accent);
      background: rgba(255,255,255,0.92);
      width: 1.75rem;
      height: 1.75rem;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
      pointer-events: none;
    }
    .section-images-numbered__item img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: contain;
      background: var(--color-card-bg);
      display: block;
      cursor: zoom-in;
    }
    .section-images-numbered__item figcaption {
      font-size: 0.8125rem;
      font-style: italic;
      color: var(--color-muted);
      margin-top: 0.4rem;
    }

    @media (max-width: 640px) {
      .section-images-grid,
      .section-images-numbered { grid-template-columns: 1fr; }
    }
    @media (min-width: 641px) and (max-width: 900px) {
      .section-images-grid { grid-template-columns: repeat(2, 1fr); }
    }

    /* ── Galerie slides ───────────────────────────────────── */
    .slides-gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
      margin-top: 3rem;
      padding-top: 2rem;
      border-top: 1px solid var(--color-border);
    }
    .slides-gallery__item {
      margin: 0;
    }
    .slides-gallery__img {
      width: 100%;
      aspect-ratio: 4/3;
      object-fit: cover;
      display: block;
      cursor: zoom-in;
    }
    .slides-gallery__caption {
      font-size: 0.8125rem;
      font-style: italic;
      color: var(--color-muted);
      margin-top: 0.5rem;
    }

    /* ── Back link ────────────────────────────────────────── */
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.8125rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--color-muted);
      transition: color 0.15s ease;
      margin-bottom: 2rem;
    }

    .back-link:hover { color: var(--color-accent); }
    .back-link svg { transition: transform 0.15s ease; }
    .back-link:hover svg { transform: translateX(-3px); }

    .project-not-found {
      text-align: center;
      padding-block: 6rem;
      color: var(--color-muted);
    }

    @media (max-width: 700px) {
      .project-hero__img { height: 50vw; }
    }

    /* ── Lightbox ─────────────────────────────────────────── */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.93);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .lightbox.is-open {
      opacity: 1;
      pointer-events: all;
    }

    .lightbox__img {
      max-width: 90vw;
      max-height: 88vh;
      object-fit: contain;
      display: block;
      user-select: none;
    }

    .lightbox__close {
      position: absolute;
      top: 1.25rem;
      right: 1.5rem;
      font-size: 2rem;
      line-height: 1;
      color: #fff;
      background: none;
      border: none;
      cursor: pointer;
      opacity: 0.65;
      padding: 0.25rem 0.5rem;
      transition: opacity 0.15s;
    }
    .lightbox__close:hover { opacity: 1; }

    .lightbox__nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 2.75rem;
      line-height: 1;
      color: #fff;
      background: none;
      border: none;
      cursor: pointer;
      opacity: 0.5;
      padding: 1rem;
      transition: opacity 0.15s;
      user-select: none;
    }
    .lightbox__nav:hover { opacity: 1; }
    .lightbox__prev { left: 0; }
    .lightbox__next { right: 0; }

    .lightbox__caption {
      position: absolute;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.65);
      font-size: 0.875rem;
      font-style: italic;
      white-space: nowrap;
      max-width: 80vw;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .lightbox__counter {
      position: absolute;
      top: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.45);
      font-size: 0.75rem;
      letter-spacing: 0.1em;
    }
  </style>
</head>
<body>

  <!-- ── Navigation ── -->
  <nav class="nav" role="navigation" aria-label="Navigation principale">
    <div class="container nav__inner">
      <a href="index.html" class="nav__logo">Zachary Drolet</a>

      <button class="nav-toggle" aria-label="Ouvrir le menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>

      <ul class="nav-menu" role="list">
        <li><a href="index.html"    class="nav-link" data-i18n="nav.home">Accueil</a></li>
        <li><a href="projets.html"  class="nav-link" data-i18n="nav.projects">Projets</a></li>
        <li><a href="a-propos.html" class="nav-link" data-i18n="nav.about">À propos</a></li>
        <li><a href="contact.html"  class="nav-link" data-i18n="nav.contact">Contact</a></li>
        <li><a href="cv.html"       class="nav-link" data-i18n="nav.cv">CV</a></li>
        <li>
          <button id="lang-toggle" class="btn-lang" data-i18n="lang.toggle" aria-label="Changer la langue">EN</button>
        </li>
      </ul>
    </div>
  </nav>

  <main style="padding-top: var(--nav-height);">

    <!-- Image hero — injecté par JS -->
    <div id="carousel-wrapper"></div>

    <section class="section">
      <div class="container">

        <a href="projets.html" class="back-link">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M10 3L5 8L10 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span data-i18n="nav.projects">Projets</span>
        </a>

        <div id="project-content">
          <div class="project-not-found"><p>Chargement…</p></div>
        </div>

      </div>
    </section>

  </main>

  <!-- ── Lightbox ── -->
  <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Image agrandie">
    <button class="lightbox__close" id="lightbox-close" aria-label="Fermer">&#x2715;</button>
    <button class="lightbox__nav lightbox__prev" id="lightbox-prev" aria-label="Précédent">&#x2039;</button>
    <img class="lightbox__img" id="lightbox-img" src="" alt="">
    <button class="lightbox__nav lightbox__next" id="lightbox-next" aria-label="Suivant">&#x203A;</button>
    <p class="lightbox__caption" id="lightbox-caption"></p>
    <p class="lightbox__counter" id="lightbox-counter"></p>
  </div>

  <!-- ── Footer ── -->
  <footer class="footer">
    <div class="container footer__inner">
      <p>Zachary Drolet — <a href="mailto:zadro@ulaval.ca" class="link-underline">zadro@ulaval.ca</a></p>
      <p data-i18n="footer.rights">Tous droits réservés</p>
    </div>
  </footer>

  <script src="data/translations.js"></script>
  <script src="data/projects.js"></script>
  <script src="js/lang.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const params  = new URLSearchParams(location.search);
      const id      = params.get('id');
      const lang    = typeof Lang !== 'undefined' ? Lang.getCurrent() : 'fr';
      const project = typeof PROJECTS !== 'undefined' ? PROJECTS.find(p => p.id === id) : null;

      const carouselWrapper = document.getElementById('carousel-wrapper');
      const content         = document.getElementById('project-content');

      if (!project) {
        content.innerHTML = `<div class="project-not-found"><p>${lang === 'fr' ? 'Projet introuvable.' : 'Project not found.'}</p></div>`;
        return;
      }

      const title = lang === 'fr' ? project.titleFR : project.titleEN;
      const type  = lang === 'fr' ? project.typeFR  : project.typeEN;
      const desc  = lang === 'fr' ? project.descriptionFR : project.descriptionEN;

      document.title = `${title} — Zachary Drolet Architecte`;

      // ── Hero ───────────────────────────────────────────────
      const heroClass = project.heroCover === false
        ? 'project-hero project-hero--contain'
        : 'project-hero';
      carouselWrapper.innerHTML = `
        <div class="${heroClass}">
          <img src="${project.image}" alt="${title}" class="project-hero__img" loading="eager">
        </div>`;

      // ── Grille d'images (grid ou numbered) ────────────────
      function renderImageBlock(images, layout) {
        const cls = layout === 'numbered'
          ? 'section-images-numbered'
          : 'section-images-grid';
        return `<div class="${cls}">
          ${images.map((img, i) => {
            const cap = lang === 'fr' ? (img.captionFR || '') : (img.captionEN || '');
            return `<figure class="${cls}__item">
              ${layout === 'numbered'
                ? `<span class="${cls}__num">${i + 1}</span>`
                : ''}
              <img src="${img.src}" alt="${cap}" loading="lazy">
              ${cap ? `<figcaption>${cap}</figcaption>` : ''}
            </figure>`;
          }).join('')}
        </div>`;
      }

      // ── Galerie des slides ─────────────────────────────────
      function renderGallery() {
        if (!project.slides || !project.slides.length) return '';
        return `<div class="slides-gallery">
          ${project.slides.map(s => {
            const cap = lang === 'fr' ? (s.captionFR || '') : (s.captionEN || '');
            return `<figure class="slides-gallery__item">
              <img src="${s.image}" alt="${cap}" class="slides-gallery__img" loading="lazy">
              ${cap ? `<figcaption class="slides-gallery__caption">${cap}</figcaption>` : ''}
            </figure>`;
          }).join('')}
        </div>`;
      }

      // ── Corps de la page ───────────────────────────────────
      function renderBody() {
        if (project.sections && project.sections.length) {
          return `<div class="sections-wrapper">
            ${project.sections.map(s => {
              const heading = lang === 'fr' ? s.headingFR : s.headingEN;
              const text    = lang === 'fr' ? (s.textFR || '') : (s.textEN || '');
              return `<div class="section-block">
                <h3 class="section-block__heading">${heading}</h3>
                ${text ? `<p class="section-block__text">${text}</p>` : ''}
                ${s.images && s.images.length ? renderImageBlock(s.images, s.layout) : ''}
                ${s.image ? `<div class="section-block__img-wrapper">
                  <img src="${s.image}" alt="${heading}" class="section-block__img" loading="lazy">
                </div>` : ''}
              </div>`;
            }).join('')}
          </div>`;
        }
        return (desc || '').split('\n\n').map(p =>
          `<p style="font-size:1.0625rem;line-height:1.85;color:var(--color-muted);margin-bottom:1rem;">${p}</p>`
        ).join('');
      }

      // ── Barre méta inline ──────────────────────────────────
      const metaBar = `
        <div class="project-meta-bar">
          <span class="project-meta-bar__item">
            <span class="project-meta-bar__label">${lang === 'fr' ? 'Type' : 'Type'}</span>
            <span class="project-meta-bar__value">${type}</span>
          </span>
          <span class="project-meta-bar__sep" aria-hidden="true">·</span>
          <span class="project-meta-bar__item">
            <span class="project-meta-bar__label">${lang === 'fr' ? 'Année' : 'Year'}</span>
            <span class="project-meta-bar__value">${project.year}</span>
          </span>
          <span class="project-meta-bar__sep" aria-hidden="true">·</span>
          <span class="project-meta-bar__item">
            <span class="project-meta-bar__label">${lang === 'fr' ? 'Lieu' : 'Location'}</span>
            <span class="project-meta-bar__value">${project.location}</span>
          </span>
        </div>`;

      content.innerHTML = `
        <div class="project-detail-body fade-in" data-delay="1">
          <h1 style="font-family:var(--font-serif);font-size:clamp(2rem,5vw,3.5rem);font-weight:300;margin-bottom:0.5rem;">${title}</h1>
          ${metaBar}
          <div class="divider"></div>
          ${renderBody()}
          ${renderGallery()}
        </div>`;

      document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));

      // ── Lightbox ───────────────────────────────────────────
      const lb      = document.getElementById('lightbox');
      const lbImg   = document.getElementById('lightbox-img');
      const lbCap   = document.getElementById('lightbox-caption');
      const lbCount = document.getElementById('lightbox-counter');

      // Hero image + toutes les images du contenu
      const heroImgEl   = carouselWrapper.querySelector('img');
      const contentImgs = Array.from(document.querySelectorAll('#project-content img'));
      const imgs        = heroImgEl ? [heroImgEl, ...contentImgs] : contentImgs;
      let current = 0;

      function lbOpen(i) {
        current = ((i % imgs.length) + imgs.length) % imgs.length;
        lbImg.src = imgs[current].src;
        lbImg.alt = imgs[current].alt;
        const fig = imgs[current].closest('figure');
        lbCap.textContent = fig ? (fig.querySelector('figcaption')?.textContent || '') : '';
        lbCount.textContent = imgs.length > 1 ? `${current + 1} / ${imgs.length}` : '';
        lb.classList.add('is-open');
        document.body.style.overflow = 'hidden';
      }

      function lbClose() {
        lb.classList.remove('is-open');
        document.body.style.overflow = '';
      }

      imgs.forEach((img, i) => img.addEventListener('click', () => lbOpen(i)));

      document.getElementById('lightbox-close').addEventListener('click', lbClose);
      document.getElementById('lightbox-prev').addEventListener('click', () => lbOpen(current - 1));
      document.getElementById('lightbox-next').addEventListener('click', () => lbOpen(current + 1));
      lb.addEventListener('click', e => { if (e.target === lb) lbClose(); });

      document.addEventListener('keydown', e => {
        if (!lb.classList.contains('is-open')) return;
        if (e.key === 'Escape')      lbClose();
        if (e.key === 'ArrowLeft')   lbOpen(current - 1);
        if (e.key === 'ArrowRight')  lbOpen(current + 1);
      });
    });
  </script>

</body>
</html>
