<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Emma Renaud Architecte</title>
  <meta name="description" content="Contactez Emma Renaud pour toute demande de collaboration.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Inter:wght@300;400;500&display=swap">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body>

  <!-- ── Navigation ── -->
  <nav class="nav" role="navigation" aria-label="Navigation principale">
    <div class="container nav__inner">
      <a href="index.html" class="nav__logo">Emma Renaud</a>

      <button class="nav-toggle" aria-label="Ouvrir le menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>

      <ul class="nav-menu" role="list">
        <li><a href="index.html"    class="nav-link" data-i18n="nav.home">Accueil</a></li>
        <li><a href="projets.html"  class="nav-link" data-i18n="nav.projects">Projets</a></li>
        <li><a href="a-propos.html" class="nav-link" data-i18n="nav.about">À propos</a></li>
        <li><a href="contact.html"  class="nav-link" data-i18n="nav.contact">Contact</a></li>
        <li><a href="cv.html"       class="nav-link" data-i18n="nav.cv">CV</a></li>
        <li>
          <button id="lang-toggle" class="btn-lang" data-i18n="lang.toggle" aria-label="Changer la langue">EN</button>
        </li>
      </ul>
    </div>
  </nav>

  <main>
    <section class="section" style="padding-top: calc(var(--nav-height) + 3rem);">
      <div class="container">

        <div class="contact-grid">

          <!-- ── Infos de contact ── -->
          <div class="contact-info fade-in">
            <h1 class="section-title" data-i18n="contact.title">Contact</h1>
            <span class="section-title-line"></span>
            <p style="margin-top: 1.5rem;" data-i18n="contact.subtitle">
              Pour toute demande de collaboration ou question
            </p>

            <div class="contact-detail" style="margin-top: 2.5rem;">
              <!-- REMPLACER : vos coordonnées -->
              <div class="contact-detail-item">
                <span class="contact-detail-label" data-i18n="contact.email">E-mail</span>
                <span class="contact-detail-value">
                  <a href="mailto:emma.renaud@exemple.fr" class="link-underline">emma.renaud@exemple.fr</a>
                </span>
              </div>

              <div class="contact-detail-item">
                <span class="contact-detail-label" data-i18n="contact.phone">Téléphone</span>
                <!-- REMPLACER : votre numéro de téléphone -->
                <span class="contact-detail-value">+33 6 12 34 56 78</span>
              </div>

              <div class="contact-detail-item">
                <span class="contact-detail-label" data-i18n="contact.address">Adresse</span>
                <!-- REMPLACER : votre ville -->
                <span class="contact-detail-value">Lyon, France</span>
              </div>
            </div>
          </div>

          <!-- ── Formulaire ── -->
          <div class="fade-in" data-delay="2">
            <!--
              TODO : pour un vrai envoi d'email, remplacer action="#" par :
              action="https://formspree.io/f/VOTRE_ID_FORMSPREE"
              method="POST"
              et supprimer le handler JS dans main.js
            -->
            <form id="contact-form" class="form" action="#" novalidate>

              <div class="form-group">
                <label for="contact-name" class="form-label" data-i18n="contact.name">Nom</label>
                <input
                  type="text"
                  id="contact-name"
                  name="name"
                  class="form-input"
                  data-i18n="contact.name"
                  placeholder="Nom"
                  required
                  autocomplete="name"
                >
              </div>

              <div class="form-group">
                <label for="contact-email" class="form-label" data-i18n="contact.email">E-mail</label>
                <input
                  type="email"
                  id="contact-email"
                  name="email"
                  class="form-input"
                  data-i18n="contact.email"
                  placeholder="E-mail"
                  required
                  autocomplete="email"
                >
              </div>

              <div class="form-group">
                <label for="contact-subject" class="form-label" data-i18n="contact.subject">Objet</label>
                <select id="contact-subject" name="subject" class="form-select">
                  <option value="collaboration" data-i18n-option="contact.subject.opt1">Collaboration</option>
                  <option value="stage"         data-i18n-option="contact.subject.opt2">Stage</option>
                  <option value="question"      data-i18n-option="contact.subject.opt3">Question</option>
                  <option value="autre"         data-i18n-option="contact.subject.opt4">Autre</option>
                </select>
              </div>

              <div class="form-group">
                <label for="contact-message" class="form-label" data-i18n="contact.message">Message</label>
                <textarea
                  id="contact-message"
                  name="message"
                  class="form-textarea"
                  data-i18n="contact.message"
                  placeholder="Message"
                  required
                ></textarea>
              </div>

              <div class="form-group">
                <label class="form-checkbox">
                  <input type="checkbox" name="rgpd" required>
                  <span class="form-checkbox-label" data-i18n="contact.rgpd">
                    J'accepte que mes données soient utilisées pour répondre à ma demande.
                  </span>
                </label>
              </div>

              <button type="submit" class="btn btn-primary" data-i18n="contact.send">Envoyer</button>

            </form>

            <!-- Message de succès (affiché après soumission) -->
            <div id="form-success" class="form-success" role="alert" data-i18n="contact.success">
              Message envoyé. Merci !
            </div>

          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- ── Footer ── -->
  <footer class="footer">
    <div class="container footer__inner">
      <p>Emma Renaud — <a href="mailto:emma.renaud@exemple.fr" class="link-underline">emma.renaud@exemple.fr</a></p>
      <p data-i18n="footer.rights">Tous droits réservés</p>
    </div>
  </footer>

  <script src="data/translations.js"></script>
  <script src="js/lang.js"></script>
  <script src="js/main.js"></script>

</body>
</html>
